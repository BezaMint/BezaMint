# git-cliff configuration for BezaMint
# Generates conventional-commit-based changelogs for GitHub releases.

[changelog]
header = """
# Changelog

All notable changes to BezaMint are documented here.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
---

Generated by [git-cliff](https://github.com/orhun/git-cliff).
"""
template = """
{% for version, release in releases %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ release.timestamp | date(format="%Y-%m-%d") }}
{{ release.body }}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^build", group = "Build System" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.1.0"
ignore_tags = ""
sort_commits = "oldest"
