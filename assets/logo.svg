<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" fill="none">
  <defs>
    <!-- Main brand gradient -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea55b" />
      <stop offset="50%" stop-color="#24a563" />
      <stop offset="100%" stop-color="#5ccc8a" />
    </linearGradient>

    <!-- Shine gradient -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0ea55b" flood-opacity="0.25" />
    </filter>

    <!-- Inner hexagon clip -->
    <clipPath id="hexClip">
      <path d="M80 15 L105 30 L105 60 L80 75 L55 60 L55 30 Z" />
    </clipPath>
  </defs>

  <!-- ===== LOGO MARK ===== -->

  <!-- Outer glow ring -->
  <circle cx="80" cy="45" r="35" fill="url(#brandGrad)" opacity="0.08" filter="url(#glow)" />

  <!-- Hexagon badge (outer) -->
  <g filter="url(#shadow)">
    <path
      d="M80 12 L108 30 L108 66 L80 84 L52 66 L52 30 Z"
      fill="url(#brandGrad)"
      rx="4"
    />
  </g>

  <!-- Inner hexagon -->
  <path
    d="M80 20 L102 34 L102 62 L80 76 L58 62 L58 34 Z"
    fill="#0c1a14"
    stroke="url(#brandGrad)"
    stroke-width="1.5"
    opacity="0.9"
  />

  <!-- Diamond / mint-leaf shape (the iconic mark) -->
  <path
    d="M80 28 L96 48 L80 68 L64 48 Z"
    fill="url(#brandGrad)"
  />

  <!-- Inner triangle (makes it a "B" / abstract play button) -->
  <path
    d="M80 36 L90 48 L80 60 L70 48 Z"
    fill="#0c1a14"
    opacity="0.85"
  />

  <!-- Small accent dot -->
  <circle cx="80" cy="48" r="3.5" fill="#ffffff" opacity="0.9" />

  <!-- Shine overlay -->
  <path
    d="M80 20 L102 34 L102 62 L80 76 L58 62 L58 34 Z"
    fill="url(#shineGrad)"
  />

  <!-- ===== TYPEFACE ===== -->

  <!-- "BEZAMINT" text -->
  <text
    x="158"
    y="52"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="42"
    letter-spacing="3"
    fill="url(#brandGrad)"
  >BEZAMINT</text>

  <!-- Subtle subtitle / tagline -->
  <text
    x="160"
    y="70"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="400"
    font-size="12"
    letter-spacing="4.5"
    fill="#7ccc9a"
    opacity="0.7"
  >NFT PLATFORM ON STELLAR</text>

  <!-- Decorative dot separator -->
  <circle cx="146" cy="48" r="2.5" fill="#24a563" opacity="0.5" />
</svg>
