[workspace]
resolver = "2"
members = [
  "nft",
  "collection",
  "royalty",
  "creator",
  "factory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BezaMint/BezaMint"

[workspace.dependencies]
soroban-sdk = "22.0.11"
soroban-token-sdk = "22.0.11"
# Pinned to 2.x: soroban-env-host 22.1.3 declares `ed25519-dalek = ">=2.0.0"`,
# and an unconstrained resolution picks 3.0.0 (rand_core 0.10) whose CryptoRng
# trait is incompatible with the rand 0.8 ChaCha20Rng used by the SDK's testutils.
# Declaring it as a dev-dependency keeps test builds unified on rand_core 0.6.
ed25519-dalek = "2.2.0"


[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.release-with-logs]
inherits = "release"
strip = false
lto = false
debug = true
codegen-units = 16
