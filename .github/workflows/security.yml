name: Security

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8am
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # The pnpm version is pinned by `packageManager` in package.json. Passing a
      # `version` input as well is an error in pnpm/action-setup v4 ("Multiple
      # versions of pnpm specified"), which failed this job before it could run.
      - uses: pnpm/action-setup@v6

      - name: Audit npm dependencies
        # Deliberately not `continue-on-error`: a high or critical advisory in
        # the dependency tree is a build-breaking problem, not a report. The
        # tree is currently clean, so a failure here is a real regression.
        run: |
          pnpm audit --audit-level=high
          pnpm audit --prod --audit-level=high

      - name: Read the pinned Rust toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' contracts/rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "contracts/rust-toolchain.toml does not declare a channel" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: contracts
