name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build optimized contracts
        run: cd contracts && cargo build --workspace --release --target wasm32-unknown-unknown

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-contracts
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download contract artifacts
        uses: actions/download-artifact@v8
        with:
          name: soroban-contracts
          path: release/

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.wasm
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
